version: "3.9"

# SkillLens AI — Phase 1 scaffold
# MongoDB driver NOT yet installed. Gate 1 approval required before
# any driver dependency is added to the api service.

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-skilllens}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: skilllens
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"   # localhost only — never exposed publicly
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-skilllens}:${MONGO_ROOT_PASSWORD}@mongo:27017/skilllens?authSource=admin
      # MONGO_DRIVER: <PENDING Gate 1 approval>
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - upload_tmp:/tmp/skilllens_uploads

  # ── Next.js frontend ────────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  upload_tmp:
